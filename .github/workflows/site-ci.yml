name: Site CI

on:
  pull_request:
    branches: [main]

permissions:
  contents: read
  pull-requests: read

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      site: ${{ steps.filter.outputs.site }}
    steps:
      - uses: dorny/paths-filter@v4
        id: filter
        with:
          filters: |
            site:
              - "site/**"
              - ".github/workflows/site-ci.yml"

  checks:
    needs: changes
    if: needs.changes.outputs.site == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Validate HTML
        run: npx --yes html-validate@9 site/index.html

      - name: Check local links and assets
        uses: lycheeverse/lychee-action@v2
        with:
          args: --offline --no-progress site/
          fail: true

  result:
    name: Site CI result
    runs-on: ubuntu-latest
    needs: [changes, checks]
    if: always()
    steps:
      - name: Fail if checks failed
        if: needs.checks.result == 'failure' || needs.checks.result == 'cancelled'
        run: exit 1
      - run: echo "Site CI passed (checks result was ${{ needs.checks.result }})"
